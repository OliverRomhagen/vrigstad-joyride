name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # data/vrigstad.json is committed: fail if it is not what tools/process.py makes from data/raw/.
      - run: npm run data && git diff --exit-code -- data/vrigstad.json
      - run: npm run build
      # The built pages are not committed (#45): fail if a merge brought one back.
      - run: test -z "$(git ls-files index.html map.html)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Screenshots of both pages, plus a trace of any failed test. Not pixel-diffed: headless WebGL output varies.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 14
