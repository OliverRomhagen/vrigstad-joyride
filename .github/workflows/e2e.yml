name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The built pages are committed: fail if they are not what src/ and data/ build to.
      - run: npm run data && npm run build && git diff --exit-code -- index.html map.html data/vrigstad.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Screenshots of both pages, plus a trace of any failed test. Not pixel-diffed: headless WebGL output varies.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 14
