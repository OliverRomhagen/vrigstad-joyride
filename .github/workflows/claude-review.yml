name: Claude review

# Reviews each PR with Claude and posts the findings as inline comments, so the maintainer reviews a version that has
# already had a thorough pass. What the review looks for is in .github/claude-review.md, read from main.
# - The first review covers the whole PR. Later pushes get a review of only the commits since the last one, which a
#   marker in the summary comment records. After a merge from main, a rebase (gh stack sync) or an amend, that is
#   only what changed besides the new base; a push that only moved the PR onto a new base isn't reviewed.
# - Opus does the full review; Sonnet, which costs less, reviews later pushes, unless one changes more than
#   OPUS_ABOVE_LINES lines: that is as much as a new PR, so it gets Opus too.
# - Drafts are skipped until they're ready for review, and so are PRs from forks: their runs get no secrets.
# - A PR by someone with no merged PR here yet waits for approval: its review runs in the APPROVAL_ENV environment,
#   whose required reviewers approve each run on the run's page. If that environment has no required reviewers, such a
#   PR isn't reviewed at all, so a missing environment can't let it through.
# - The summary comment shows what each review cost, and the total so far on the PR.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # Skip PRs that only change docs, labels, issue forms, agent files or other workflows, as unit.yml does.
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.github/**'
      - '.github/workflows/claude-review.yml'
      - '.github/claude-review.md'

permissions:
  contents: read

jobs:
  gate:
    name: Who may run the review
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to read the approval environment's protection rules
    outputs:
      run: ${{ steps.gate.outputs.run }}
      approval: ${{ steps.gate.outputs.approval }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          SENDER: ${{ github.event.sender.login }}
          APPROVAL_ENV: claude-review-approval # also named in the review job's environment
        run: |
          set -euo pipefail
          # The action doesn't review bots' PRs, so don't make them wait for approval either.
          if [ "$AUTHOR_TYPE" = Bot ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Known: has a merged PR here. Both the PR's author and whoever pushed must be, so a new collaborator pushing
          # to a known author's PR still needs approval.
          known() { [ "$(gh api -X GET search/issues -f q="repo:$GH_REPO is:pr is:merged author:$1" --jq .total_count 2>/dev/null || echo 0)" -gt 0 ]; }
          unknown=()
          known "$AUTHOR" || unknown+=("$AUTHOR")
          [ "$SENDER" = "$AUTHOR" ] || known "$SENDER" || unknown+=("$SENDER")
          if [ ${#unknown[@]} -eq 0 ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "approval=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          who=$(IFS=,; echo "${unknown[*]}")
          # On any error this reads as no reviewers, so the review doesn't run unapproved.
          reviewers=$(gh api "repos/$GH_REPO/environments/$APPROVAL_ENV" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "$reviewers" -gt 0 ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "approval=true" >>"$GITHUB_OUTPUT"
            echo "No merged PR here yet by $who: the review waits for a maintainer to approve it." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::warning::No merged PR here yet by $who, and the $APPROVAL_ENV environment has no required reviewers: not reviewing."
          fi

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # A run that needs approval waits here until one of the environment's required reviewers approves it. An empty
    # name means no environment.
    environment: ${{ needs.gate.outputs.approval == 'true' && 'claude-review-approval' || '' }}
    # A new push cancels the review of the previous one. A cancelled review records no marker, so the next one also
    # covers the commits it missed. On the job, not the workflow, so a run the job's condition skips, such as a draft's,
    # doesn't cancel a review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the action exchanges it for the Claude GitHub app's token
    # No GH_TOKEN here: only the two steps that call gh get the job's token. The review step still holds a token: the
    # action puts the Claude app's token in its own env, which Claude's process inherits and its Read tool could reach
    # (/proc/self/environ). That is why Claude gets no shell, and why the comments it reads are only the maintainers'.
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      OPUS_ABOVE_LINES: 400 # added plus removed lines in a later push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Don't leave the job's token in the git config, where Claude's Read tool could reach it. The repo is public,
          # so the later fetch needs no token.
          persist-credentials: false

      - name: Gather the review's context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event() { jq -r "$1" "$GITHUB_EVENT_PATH"; }
          mkdir -p .claude-review

          # The summary comment from the last review, and the commit and costs it recorded.
          marker=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review -->"))) | {id, body}' |
            jq -s 'last // {}')
          field() { jq -r '.body // ""' <<<"$marker" | grep -oE "$1=[^ ]+" | head -1 | cut -d= -f2 || true; }
          last_sha=$(field sha)
          echo "last_sha=$last_sha" >>"$GITHUB_OUTPUT"
          echo "comment_id=$(jq -r '.id // ""' <<<"$marker")" >>"$GITHUB_OUTPUT"
          echo "runs=$(field runs)" >>"$GITHUB_OUTPUT"
          echo "total=$(field cost)" >>"$GITHUB_OUTPUT"

          merge_base=$(git merge-base "origin/$BASE_REF" HEAD)
          # After a force push the last reviewed commit is on no branch, but GitHub still serves it by its SHA.
          if [ -n "$last_sha" ] && ! git cat-file -e "$last_sha^{commit}" 2>/dev/null; then
            git fetch -q origin "$last_sha" 2>/dev/null || true
          fi
          if [ -z "$last_sha" ] || ! git cat-file -e "$last_sha^{commit}" 2>/dev/null; then
            mode=full from=$merge_base since=$merge_base
          elif [ "$last_sha" = "$HEAD_SHA" ]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Already reviewed $HEAD_SHA." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          elif git merge-base --is-ancestor "$last_sha" HEAD && git merge-base --is-ancestor "$merge_base" "$last_sha"; then
            mode=incremental from=$last_sha since=$last_sha
          # main was merged in, or the branch was rebased (gh stack sync) or amended since the last review: compare with
          # the last review merged onto the PR's base as it is now, so neither main's changes nor the PR's own reviewed
          # ones are reviewed again. If that merge conflicts, review the whole PR.
          elif tree=$(git merge-tree --write-tree --no-messages "$last_sha" "$merge_base"); then
            mode=incremental from=$(head -1 <<<"$tree") since=$last_sha
          else
            mode=full from=$merge_base since=$merge_base
          fi

          # The action refuses to run a workflow that differs from main's, so don't start it for a PR that changes this
          # one: the summary comment says why it wasn't reviewed. The run uses the PR merged into main, so a PR that is
          # only behind main runs main's copy: compare with the merge base, not with main.
          if ! git diff --quiet "$merge_base" HEAD -- .github/workflows/claude-review.yml; then
            echo "workflow_changed=true" >>"$GITHUB_OUTPUT"
            echo "since=$since" >>"$GITHUB_OUTPUT"
            echo "mode=$mode" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git diff "$from..HEAD" >.claude-review/diff.patch
          # A push that only moved the PR onto a new base leaves nothing to review: record it and skip the review.
          if [ "$mode" = incremental ] && [ ! -s .claude-review/diff.patch ]; then
            echo "nothing=true" >>"$GITHUB_OUTPUT"
            echo "since=$since" >>"$GITHUB_OUTPUT"
            echo "Nothing new to review since $since." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff "$merge_base..HEAD" >.claude-review/full.patch
          # Claude gets no shell (a git command can write files, `git grep -O` runs a program), so what it would ask
          # git for is written out here.
          git log --format='%h %an: %s' "$merge_base..HEAD" >.claude-review/commits.txt
          git show "origin/main:AGENTS.md" >.claude-review/AGENTS.md 2>/dev/null || cp AGENTS.md .claude-review/AGENTS.md
          gh pr view "$PR" --json title,body,author,labels >.claude-review/pr.json
          # Inline comments, review summaries and top-level comments: findings are raised in all three. Only those by
          # people with write access and by the review's own bots: anyone can comment on a public repo's PR, and Claude
          # reads these, so an outsider's comment could steer the review.
          trusted='select((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) or (.user.login | IN("github-actions[bot]", "claude[bot]")))'
          {
            gh api "repos/$GH_REPO/pulls/$PR/comments" --paginate --jq ".[] | $trusted | {user: .user.login, path, line, body}"
            gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --jq ".[] | select(.body != \"\") | $trusted | {user: .user.login, body}"
            gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq ".[] | $trusted | {user: .user.login, body}"
          } | jq -s . >.claude-review/comments.json

          changed=$(git diff --numstat "$from" HEAD | awk '{ n += $1 + $2 } END { print n + 0 }')
          if [ "$mode" = full ] || [ "$changed" -gt "$OPUS_ABOVE_LINES" ]; then model=claude-opus-5-5; else model=claude-sonnet-5-5; fi
          if [ "$mode" = full ]; then turns=40; else turns=20; fi
          {
            echo "mode=$mode"
            echo "since=$since"
            echo "model=$model"
            echo "turns=$turns"
            # From main, so an edit to the instructions takes effect once it merges; until this file is on main, the PR's
            # copy. A PR can't change its own review by editing this workflow either: the action skips the review when
            # the workflow differs from main's.
            echo 'instructions<<CLAUDE_REVIEW_EOF'
            git show "origin/main:.github/claude-review.md" 2>/dev/null || cat .github/claude-review.md
            echo 'CLAUDE_REVIEW_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Review
        id: claude
        if: steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.nothing != 'true' && steps.ctx.outputs.workflow_changed != 'true'
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          # An API key when the repo has one, else a Claude subscription's token (`claude setup-token`), which uses
          # that plan's limits instead of credits. Only one is passed, so it's always clear which one pays.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW: ${{ steps.ctx.outputs.mode }}, from ${{ steps.ctx.outputs.since }} to ${{ github.event.pull_request.head.sha }}

            ${{ steps.ctx.outputs.instructions }}
          claude_args: |
            --model ${{ steps.ctx.outputs.model }}
            --max-turns ${{ steps.ctx.outputs.turns }}
            --permission-mode default
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"comments":{"type":"integer"}},"required":["summary","comments"]}'

      - name: Post the summary and cost
        if: ${{ !cancelled() && steps.ctx.outputs.skip != 'true' && steps.ctx.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          COMMENT_ID: ${{ steps.ctx.outputs.comment_id }}
          LAST_SHA: ${{ steps.ctx.outputs.last_sha }}
          NOTHING: ${{ steps.ctx.outputs.nothing }}
          WORKFLOW_CHANGED: ${{ steps.ctx.outputs.workflow_changed }}
          MODE: ${{ steps.ctx.outputs.mode }}
          FROM: ${{ steps.ctx.outputs.since }}
          MODEL: ${{ steps.ctx.outputs.model }}
          # On a subscription nothing is billed per review: Claude Code's figure is what it would have cost on the API.
          COST_NOTE: ${{ secrets.ANTHROPIC_API_KEY == '' && ' (API price estimate; paid by a subscription)' || '' }}
          RUNS: ${{ steps.ctx.outputs.runs }}
          TOTAL: ${{ steps.ctx.outputs.total }}
        run: |
          set -euo pipefail
          # Claude Code's log ends with a result message that holds the run's cost in US dollars.
          cost=0
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cost=$(jq '[.[] | select(.type == "result")] | last | .total_cost_usd // 0' "$EXECUTION_FILE")
          fi
          runs=$(( ${RUNS:-0} + 1 ))
          [ "$NOTHING" != true ] && [ "$WORKFLOW_CHANGED" != true ] || runs=${RUNS:-0}
          reviews=$([ "$runs" = 1 ] && echo review || echo reviews)
          total=$(awk -v a="${TOTAL:-0}" -v b="$cost" 'BEGIN { printf "%.2f", a + b }')
          cost=$(awk -v c="$cost" 'BEGIN { printf "%.2f", c }')

          if [ "$MODE" = full ]; then scope="the whole PR"; else scope="the commits since \`${FROM:0:7}\`"; fi
          subtype=$(jq -r '[.[] | select(.type == "result")] | last | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || true)
          if [ "$NOTHING" = true ]; then
            summary="Nothing new to review: the push only moved the PR onto a new base."
            sha=$HEAD_SHA
          elif [ "$WORKFLOW_CHANGED" = true ]; then
            summary="Not reviewed: this PR changes the review workflow, and the action only runs the workflow as it is on main."
            sha=$LAST_SHA
          # A review that ran out of turns has posted what it found, and spent the money: record it too, or every later
          # push would start another full review that runs out the same way. The summary says plainly that the rest
          # wasn't reviewed, so the maintainer knows to read it more closely.
          elif [ "$CONCLUSION" = success ] || [ "$subtype" = error_max_turns ]; then
            fallback="No summary returned."
            [ "$subtype" != error_max_turns ] || fallback="It ran out of turns before it finished: what it found is posted inline, and the rest of $scope isn't reviewed, by this run or a later one."
            summary=$(jq -r --arg f "$fallback" '.summary // $f' <<<"${STRUCTURED:-"{}"}")
            # Only a review that ran moves the marker, so a failed one is retried in full on the next push.
            sha=$HEAD_SHA
          else
            summary="The review didn't finish ([run log]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)); the next push reviews these commits again."
            sha=$LAST_SHA
          fi
          # Name the model only when one ran.
          name=
          if [ "$NOTHING" != true ] && [ "$WORKFLOW_CHANGED" != true ]; then
            name=$([ "$MODEL" = claude-opus-5-5 ] && echo ' (Opus)' || echo ' (Sonnet)')
          fi

          {
            echo '<!-- claude-review -->'
            echo "<!-- claude-review: sha=${sha:-none} runs=$runs cost=$total -->"
            echo "**Claude review**$name of $scope, up to \`${HEAD_SHA:0:7}\`: $summary"
            echo
            echo "<sub>This review: \$$cost · this PR so far: \$$total over $runs $reviews$COST_NOTE.</sub>"
          } >"$RUNNER_TEMP/comment.md"

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/comment.md" --silent
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent
          fi
          echo "Review cost: \$$cost (PR total \$$total over $runs $reviews)$COST_NOTE" >>"$GITHUB_STEP_SUMMARY"
