name: Claude review

# Reviews each PR with Claude and posts the findings as inline comments, so the maintainer reviews a version that has
# already had a thorough pass. What the review looks for is in .github/claude-review.md, read from main.
# - The first review covers the whole PR. Later pushes get a review of only the commits since the last one, which a
#   marker in the summary comment records. After a merge from main, a rebase (gh stack sync) or an amend, that is
#   only what changed besides the new base; a push that only moved the PR onto a new base isn't reviewed. Files nobody
#   reads line by line are left out of every review: those .gitattributes marks generated or vendored, and any other
#   file with a very long line or a very large patch. The summary comment lists them.
# - Opus does the full review; Sonnet, which costs less, reviews later pushes, unless one changes more than
#   OPUS_ABOVE_LINES lines: that is as much as a new PR, so it gets Opus too.
# - Drafts are skipped until they're ready for review, and so are PRs from forks. So are PRs into another branch than
#   main, such as the upper PRs of a stack, until they're retargeted to main.
# - A PR by someone with no merged PR here yet waits for approval: its review runs after a job in the APPROVAL_ENV
#   environment, whose required reviewers approve each run on the run's page. If that environment has no required
#   reviewers, such a PR isn't reviewed at all, so a missing environment can't let it through.
# - The summary comment shows what each review cost, and the total so far on the PR.
#
# Security: the review holds a secret and reads code anyone with push access wrote, so:
# - It runs on pull_request_target: this file, and so the gate, always come from main, and a PR can't edit them.
#   That is safe only because no step runs the PR's code: the checkout is read by git, jq and Claude's file tools,
#   and nothing in it is executed, installed or sourced. Keep it that way. The cost: a change to this file can't be
#   tried out in its own PR; it runs once it's on main.
# - The secret is meant to live in the claude-review environment, which only main may deploy to, rather than in the
#   repo's secrets, which a workflow pushed on any branch can read. Until it is moved there, the repo's are used.
# - Claude runs with --restricted: Read, Grep and Glob only, inside the checkout (symlinks out of it included), and
#   none of the PR's settings, hooks, MCP servers or CLAUDE.md. It has no GitHub token and no way to post: it
#   returns its findings, and the last step breaks images, HTML and @-mentions in them, checks them for the secret,
#   and posts them.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    # Skip PRs that only change docs, labels, issue forms, agent files or other workflows, as unit.yml does.
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.github/**'
      - '.github/workflows/claude-review.yml'
      - '.github/claude-review.md'

permissions:
  contents: read

jobs:
  gate:
    name: Who may run the review
    # An edit counts only when it moved the PR onto another base: a stack's PR retargeted to main once the one below
    # it merges.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to read the approval environment's protection rules
      pull-requests: write # to say on the PR when it isn't reviewed for want of an approver
    outputs:
      run: ${{ steps.gate.outputs.run }}
      approval: ${{ steps.gate.outputs.approval }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          PR: ${{ github.event.pull_request.number }}
          APPROVAL_ENV: claude-review-approval # also named in the approve job's environment
        run: |
          set -euo pipefail
          # The review doesn't need to cover bots' PRs, so don't make them wait for approval either.
          if [ "$AUTHOR_TYPE" = Bot ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Known: has a merged PR here. Both the PR's author and whoever pushed must be, so a new collaborator pushing
          # to a known author's PR still needs approval.
          # A failed search counts as unknown, so the review doesn't run unapproved, but says why in the log.
          known() {
            local n
            if ! n=$(gh api -X GET search/issues -f q="repo:$GH_REPO is:pr is:merged author:$1" --jq .total_count 2>&1); then
              echo "::warning::Couldn't look up $1's merged PRs, so counting them as new: $n"
              return 1
            fi
            [ "$n" -gt 0 ]
          }
          unknown=()
          known "$AUTHOR" || unknown+=("$AUTHOR")
          # A bot pushing to a person's PR (a merge from main, an autofix) isn't a new collaborator, and the search
          # can't take a bot's login anyway.
          [ "$SENDER" = "$AUTHOR" ] || [ "$SENDER_TYPE" = Bot ] || known "$SENDER" || unknown+=("$SENDER")
          if [ ${#unknown[@]} -eq 0 ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "approval=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          who=$(IFS=,; echo "${unknown[*]}")
          # On any error this reads as no reviewers, so the review doesn't run unapproved.
          reviewers=$(gh api "repos/$GH_REPO/environments/$APPROVAL_ENV" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "$reviewers" -gt 0 ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "approval=true" >>"$GITHUB_OUTPUT"
            echo "No merged PR here yet by $who: the review waits for a maintainer to approve it." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::warning::No merged PR here yet by $who, and the $APPROVAL_ENV environment has no required reviewers: not reviewing."
            # Say so on the PR once, so a missing review doesn't look like a broken workflow.
            mark='<!-- claude-review-unapproved -->'
            # Only the bot's own comment counts, and a failed call only warns: the notice isn't worth a red check.
            if ! bodies=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body'); then
              echo "::warning::Couldn't read the PR's comments, so not saying why on the PR."
            elif ! grep -qF "$mark" <<<"$bodies"; then
              printf '%s\n**Claude review:** not run. No merged PR here yet by %s, and nobody is set up to approve a review for a new contributor (the `%s` environment has no required reviewers).\n' \
                "$mark" "$who" "$APPROVAL_ENV" | gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@- --silent ||
                echo "::warning::Couldn't comment on the PR to say why it isn't reviewed."
            fi
          fi

  approve:
    name: Approve the review
    needs: gate
    if: needs.gate.outputs.approval == 'true'
    # Waits here until one of the environment's required reviewers approves the run. A job of its own, so the review
    # job's environment can be the one that holds the secret. A new push cancels the wait for the previous one.
    environment: claude-review-approval
    concurrency:
      group: claude-review-approve-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Approved."

  review:
    name: Claude review
    needs: [gate, approve]
    # The approve job is skipped when no approval is needed, and fails or is cancelled when it is refused or replaced.
    if: >-
      !cancelled() && needs.gate.outputs.run == 'true' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    # Holds the secret, once it's moved there from the repo's secrets: allowed to deploy from main only, so only a
    # workflow from main can read it. pull_request_target runs with main as its ref.
    environment: claude-review
    # A new push cancels the review of the previous one. A cancelled review records no marker, so the next one also
    # covers the commits it missed. Nor does it record its cost: the summary step doesn't run on a cancelled job, so
    # what a cancelled review spent is missing from the PR's total. On the job, not the workflow, so a run the job's
    # condition skips, such as a draft's, doesn't cancel a review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # No GH_TOKEN here: only the steps that call gh get the job's token, and Claude's isn't one of them.
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      OPUS_ABOVE_LINES: 400 # added plus removed lines in a later push
      # A file whose patch has a longer line, or is larger, isn't reviewed: minified code, one-line JSON, data dumps.
      # The longest line in the repo's source is about 500 characters, and its largest source file 62 KB.
      MAX_LINE_CHARS: 5000
      MAX_PATCH_KB: 256
      # How long Claude may take, below the job's limit, so a review that runs long fails rather than cancelling the
      # job: the summary step still runs and records it.
      REVIEW_MINUTES: 15
      CLAUDE_CODE_VERSION: 2.1.325
    steps:
      # Before the checkout, and outside it, so nothing in the PR (an .npmrc) can change what is installed.
      - name: Install Claude Code
        working-directory: ${{ runner.temp }}
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No token in .git/config, where Claude's Read tool could reach it. The repo is public, so the fetches
          # before the review need none.
          persist-credentials: false

      - name: Gather the review's context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .claude-review

          # The PR's top-level comments, read once: the marker and comments.json both come from them.
          gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[]' | jq -s . >"$RUNNER_TEMP/issue-comments.json"
          # The summary comment from the last review, and the commit and costs it recorded.
          marker=$(jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review -->"))) | {id, body}] | last // {}' \
            "$RUNNER_TEMP/issue-comments.json")
          field() { jq -r '.body // ""' <<<"$marker" | grep -oE "$1=[^ ]+" | head -1 | cut -d= -f2 || true; }
          last_sha=$(field sha)
          echo "last_sha=$last_sha" >>"$GITHUB_OUTPUT"
          echo "comment_id=$(jq -r '.id // ""' <<<"$marker")" >>"$GITHUB_OUTPUT"
          echo "runs=$(field runs)" >>"$GITHUB_OUTPUT"
          echo "total=$(field cost)" >>"$GITHUB_OUTPUT"

          merge_base=$(git merge-base "origin/$BASE_REF" HEAD)
          # After a force push the last reviewed commit is on no branch, but GitHub still serves it by its SHA.
          if [ -n "$last_sha" ] && ! git cat-file -e "$last_sha^{commit}" 2>/dev/null; then
            git fetch -q origin "$last_sha" 2>/dev/null || true
          fi
          if [ -z "$last_sha" ] || ! git cat-file -e "$last_sha^{commit}" 2>/dev/null; then
            mode=full from=$merge_base since=$merge_base
          elif [ "$last_sha" = "$HEAD_SHA" ]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Already reviewed $HEAD_SHA." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          elif git merge-base --is-ancestor "$last_sha" HEAD && git merge-base --is-ancestor "$merge_base" "$last_sha"; then
            mode=incremental from=$last_sha since=$last_sha
          # main was merged in, or the branch was rebased (gh stack sync) or amended since the last review: compare with
          # the last review merged onto the PR's base as it is now, so neither main's changes nor the PR's own reviewed
          # ones are reviewed again. If that merge conflicts, review the whole PR.
          elif tree=$(git merge-tree --write-tree --no-messages "$last_sha" "$merge_base"); then
            mode=incremental from=$(head -1 <<<"$tree") since=$last_sha
          else
            mode=full from=$merge_base since=$merge_base
          fi

          # Leave out of the patches and the line count what nobody reads line by line, so it can't fill Claude's
          # context: data/vrigstad.json is one line of about 200 KB, and would count as 2 changed lines. Left out are
          # files that .gitattributes marks linguist-generated or linguist-vendored, read from main so a PR can't hide
          # its own code by marking it, and any other file whose patch is over MAX_LINE_CHARS wide or MAX_PATCH_KB in
          # size. Binary files need nothing: git diff shows only that they differ. What makes the generated files
          # (tools/, package.json) is reviewed. skipped.txt lists what was left out and why (path, tab, reason), for
          # Claude and the summary.
          # File names are read NUL-separated and unquoted, so a name with å, ä or ö, a space or a colon still matches;
          # without renames, so a moved file's old path is checked too.
          : >.claude-review/skipped.txt
          pathspec=(.) # what to review: everything, minus what is left out below
          while IFS= read -r -d '' f; do
            reason= marked=
            for attr in generated vendored; do
              # -z prints path, attribute and value NUL-separated: the value is the last field, whatever the name.
              value=$(git check-attr -z --source=origin/main "linguist-$attr" -- "$f" | tr '\0' '\n' | tail -1)
              if [ "$value" = true ] || [ "$value" = set ]; then marked=${marked:+$marked,}$attr; fi
            done
            if [ -n "$marked" ]; then
              reason="marked $marked in .gitattributes"
            else
              read -r widest kb < <(git diff "$merge_base" HEAD -- ":(literal)$f" |
                awk '{ if (length > w) w = length; b += length + 1 } END { print w + 0, int(b / 1024) }')
              if [ "$widest" -gt "$MAX_LINE_CHARS" ]; then
                reason="a line of $widest characters"
              elif [ "$kb" -gt "$MAX_PATCH_KB" ]; then
                reason="a $kb KB patch"
              fi
            fi
            if [ -n "$reason" ]; then
              pathspec+=(":(exclude,literal)$f")
              printf '%s\t%s\n' "$f" "$reason" >>.claude-review/skipped.txt
            fi
          done < <({
            git -c core.quotePath=false diff --name-only --no-renames -z "$merge_base" HEAD
            git -c core.quotePath=false diff --name-only --no-renames -z "$from" HEAD
          } | sort -zu)

          # Unquoted names here too, so the summary step can match a finding's path with a patch's.
          git -c core.quotePath=false diff "$from..HEAD" -- "${pathspec[@]}" >.claude-review/diff.patch
          # A push that only moved the PR onto a new base, or a PR or push that only changes files left out, leaves
          # nothing to review: record it and skip the review.
          if [ ! -s .claude-review/diff.patch ]; then
            echo "nothing=true" >>"$GITHUB_OUTPUT"
            echo "since=$since" >>"$GITHUB_OUTPUT"
            echo "mode=$mode" >>"$GITHUB_OUTPUT"
            echo "Nothing to review in $mode mode since $since: no changes outside the files left out." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c core.quotePath=false diff "$merge_base..HEAD" -- "${pathspec[@]}" >.claude-review/full.patch
          # Claude gets no shell (a git command can write files, `git grep -O` runs a program), so what it would ask
          # git for is written out here.
          git log --format='%h %an: %s' "$merge_base..HEAD" >.claude-review/commits.txt
          git show "origin/main:AGENTS.md" >.claude-review/AGENTS.md 2>/dev/null || cp AGENTS.md .claude-review/AGENTS.md
          gh pr view "$PR" --json title,body,author,labels >.claude-review/pr.json
          # Inline comments, review summaries and top-level comments: findings are raised in all three. Only those by
          # people with write access, the PR's author (known, or approved by a maintainer) and the review's own bot:
          # anyone can comment on a public repo's PR, and Claude reads these, so an outsider's comment could steer the
          # review. A login is only letters, digits and hyphens, so it is safe inside the filter.
          trusted="select((.author_association | IN(\"OWNER\", \"MEMBER\", \"COLLABORATOR\")) or (.user.login | IN(\"$AUTHOR\", \"github-actions[bot]\")))"
          {
            gh api "repos/$GH_REPO/pulls/$PR/comments" --paginate --jq ".[] | $trusted | {user: .user.login, path, line, body}"
            gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --jq ".[] | select(.body != \"\") | $trusted | {user: .user.login, body}"
            jq ".[] | $trusted | {user: .user.login, body}" "$RUNNER_TEMP/issue-comments.json"
          } | jq -s . >.claude-review/comments.json

          changed=$(git diff --numstat "$from" HEAD -- "${pathspec[@]}" | awk '{ n += $1 + $2 } END { print n + 0 }')
          if [ "$mode" = full ] || [ "$changed" -gt "$OPUS_ABOVE_LINES" ]; then model=claude-opus-5-5; else model=claude-sonnet-5-5; fi
          if [ "$mode" = full ]; then turns=40; else turns=20; fi
          {
            echo "mode=$mode"
            echo "since=$since"
            echo "model=$model"
            echo "turns=$turns"
            # From main, like this file, so a PR can't change the instructions it's reviewed by.
            echo 'instructions<<CLAUDE_REVIEW_EOF'
            git show "origin/main:.github/claude-review.md"
            echo 'CLAUDE_REVIEW_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Review
        id: claude
        if: steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.nothing != 'true'
        env:
          # An API key when there is one, else a Claude subscription's token (`claude setup-token`), which uses that
          # plan's limits instead of credits. Only one is passed, so it's always clear which one pays.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          MODE: ${{ steps.ctx.outputs.mode }}
          SINCE: ${{ steps.ctx.outputs.since }}
          MODEL: ${{ steps.ctx.outputs.model }}
          TURNS: ${{ steps.ctx.outputs.turns }}
          INSTRUCTIONS: ${{ steps.ctx.outputs.instructions }}
        run: |
          set -uo pipefail
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          prompt=$(printf 'REPO: %s\nPR NUMBER: %s\nREVIEW: %s, from %s to %s\n\n%s' \
            "$GH_REPO" "$PR" "$MODE" "$SINCE" "$HEAD_SHA" "$INSTRUCTIONS")
          schema='{"type":"object","required":["summary","findings"],"properties":{
            "summary":{"type":"string"},
            "findings":{"type":"array","items":{"type":"object","required":["path","line","body"],"properties":{
              "path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}}}}}}'
          # --restricted: only the file tools, confined to the checkout, and none of the PR's settings, hooks, MCP
          # servers or CLAUDE.md. --safe-mode turns off the rest of what a checkout can bring (skills, agents,
          # commands), in case a later version of --restricted lets one through. The deny rule keeps Claude out of
          # .git too.
          status=0
          timeout "${REVIEW_MINUTES}m" claude -p "$prompt" \
            --restricted --safe-mode --strict-mcp-config --no-session-persistence \
            --tools Read,Grep,Glob \
            --settings '{"permissions":{"deny":["Read(./.git/**)","Read(//proc/**)"]}}' \
            --model "$MODEL" --max-turns "$TURNS" \
            --output-format json --json-schema "$schema" >"$RUNNER_TEMP/claude.json" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"
          exit "$status"

      - name: Post the findings, the summary and the cost
        if: ${{ !cancelled() && steps.ctx.outputs.skip != 'true' && steps.ctx.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.claude.outputs.status }}
          COMMENT_ID: ${{ steps.ctx.outputs.comment_id }}
          LAST_SHA: ${{ steps.ctx.outputs.last_sha }}
          NOTHING: ${{ steps.ctx.outputs.nothing }}
          MODE: ${{ steps.ctx.outputs.mode }}
          FROM: ${{ steps.ctx.outputs.since }}
          MODEL: ${{ steps.ctx.outputs.model }}
          # On a subscription nothing is billed per review: Claude Code's figure is what it would have cost on the API.
          COST_NOTE: ${{ secrets.ANTHROPIC_API_KEY == '' && ' (API price estimate; paid by a subscription)' || '' }}
          RUNS: ${{ steps.ctx.outputs.runs }}
          TOTAL: ${{ steps.ctx.outputs.total }}
          # Only to check that Claude's output doesn't contain them.
          SECRET_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECRET_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_FINDINGS: 50
          MAX_BODY_CHARS: 4000
        run: |
          set -euo pipefail
          # Claude Code's output is one result message: the run's cost in US dollars, how it ended, and the findings.
          result=$RUNNER_TEMP/claude.json
          cost=0 subtype= out='{}'
          if [ -s "$result" ] && jq -e 'type == "object"' "$result" >/dev/null 2>&1; then
            cost=$(jq '.total_cost_usd // 0' "$result")
            subtype=$(jq -r '.subtype // ""' "$result")
            out=$(jq -c '.structured_output // {} | if type == "object" then . else {} end' "$result")
          fi
          runs=$(( ${RUNS:-0} + 1 ))
          [ "$NOTHING" != true ] || runs=${RUNS:-0}
          reviews=$([ "$runs" = 1 ] && echo review || echo reviews)
          total=$(awk -v a="${TOTAL:-0}" -v b="$cost" 'BEGIN { printf "%.2f", a + b }')
          cost=$(awk -v c="$cost" 'BEGIN { printf "%.2f", c }')

          if [ "$MODE" = full ]; then scope="the whole PR"; else scope="the commits since \`${FROM:0:7}\`"; fi
          findings=$RUNNER_TEMP/findings.json
          echo '[]' >"$findings"
          if [ "$NOTHING" = true ]; then
            if [ "$MODE" = full ]; then
              summary="Nothing to review: the PR changes nothing outside the files left out below."
            else
              summary="Nothing new to review: the push only moved the PR onto a new base, or only changed files left out of the review."
            fi
            sha=$HEAD_SHA
          elif [ "$subtype" = success ]; then
            summary=$(jq -r '(.summary // "") | tostring | if . == "" then "No summary returned." else . end' <<<"$out")
            # Lines a review comment can go on: the new side of the PR's diff, context included. A finding elsewhere
            # goes in the summary comment instead, as GitHub would refuse the whole review over it.
            awk '
              /^diff --git / { header = 1; path = ""; next }
              # git ends the name with a tab when it holds a space.
              header && /^\+\+\+ / { p = substr($0, 5); sub(/\t$/, "", p); path = (p == "/dev/null") ? "" : substr(p, 3); next }
              /^@@ / { header = 0; match($0, /\+[0-9]+/); n = substr($0, RSTART + 1, RLENGTH - 1) + 0; next }
              !header && path != "" && /^[ +]/ { print path "\t" n++ }
            ' .claude-review/full.patch >"$RUNNER_TEMP/lines.txt"
            jq -c --arg ws "$GITHUB_WORKSPACE/" --rawfile lines "$RUNNER_TEMP/lines.txt" --argjson max "$MAX_FINDINGS" '
              ($lines | split("\n") | map(select(. != "") | {key: ., value: true}) | from_entries) as $ok
              | [(.findings // [])[]? | select(type == "object")
                  | {path: ((.path // "") | tostring | ltrimstr($ws) | ltrimstr("./")),
                     line: (((.line | tonumber?) // 0) | floor),
                     body: ((.body // "") | tostring)}
                  | select(.path != "" and .body != "")][:$max]
              | map(. + {inline: ($ok[.path + "\t" + (.line | tostring)] == true)})' <<<"$out" >"$findings"
            # Only a review that ran moves the marker, so a failed one is retried in full on the next push.
            sha=$HEAD_SHA
          # A review that ran out of turns or time spent the money: record it, or every later push would start another
          # one that ends the same way. It returns its findings only at the end, so it has none: say so plainly.
          elif [ "$subtype" = error_max_turns ]; then
            summary="It ran out of turns before it finished, so it has no findings to post. Review this by hand: a later run won't review these commits again."
            sha=$HEAD_SHA
          elif [ "$STATUS" = 124 ]; then
            summary="It ran out of time ($REVIEW_MINUTES minutes) before it finished, so it has no findings to post. Review this by hand: a later run won't review these commits again. Its cost isn't counted."
            sha=$HEAD_SHA
          else
            summary="The review didn't finish ([run log]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)); the next push reviews these commits again."
            sha=$LAST_SHA
          fi

          # A tripwire, behind the real guard (Claude can't read the environment): if anything it would post contains
          # the secret, or a run of it, or its base64 or hex, post none of it.
          needles=$RUNNER_TEMP/needles.txt
          : >"$needles"
          for s in "$SECRET_API_KEY" "$SECRET_OAUTH_TOKEN"; do
            [ "${#s}" -ge 16 ] || continue
            for ((i = 0; i + 16 <= ${#s}; i += 8)); do printf '%s\n' "${s:i:16}" >>"$needles"; done
            for k in 0 1 2; do
              b=$(printf '%*s%s' "$k" '' "$s" | base64 -w0)
              printf '%s\n' "${b:4:${#b}-8}" >>"$needles"
            done
            hex=$(printf '%s' "$s" | od -An -tx1 | tr -d ' \n')
            printf '%s\n%s\n' "${hex:0:40}" "$(tr a-f A-F <<<"${hex:0:40}")" >>"$needles"
          done
          # Through a file, not a pipe: with pipefail, grep -q stopping at the first match could fail the writer and
          # read as no match.
          { printf '%s\n' "$summary"; jq -r '.[] | .path, .body' "$findings"; } >"$RUNNER_TEMP/outgoing.txt"
          leaked=false
          if [ -s "$needles" ] && grep -qF -f "$needles" "$RUNNER_TEMP/outgoing.txt"; then
            leaked=true
            echo '[]' >"$findings"
            summary="Withheld: what the review returned contains the secret it runs with, so none of it is posted. Rotate the secret, and look in the PR for text that told the review to do this."
            sha=$LAST_SHA
            echo "::error::The review's output contained its secret; nothing it returned was posted."
          fi

          # No images (GitHub fetches them when the comment is shown, which would send what's in their URL away), no
          # HTML, no link definitions, no rendered diagrams or maps, and no @-mentions, however the review was steered.
          # A zero-width space breaks each, in one pass that can't rebuild what it breaks (stripping a tag can:
          # <im<img>g ...>), and is invisible inside code. Links stay: they leak only when someone clicks one. A
          # suggestion that would change is shown as plain code, so committing it can't add the zero-width spaces.
          clean='def clean($max):
            gsub("<(?<c>[A-Za-z/!?])"; "<\u200b\(.c)")
            | gsub("!\\["; "!\u200b[")
            | gsub("@(?<c>[A-Za-z0-9])"; "@\u200b\(.c)")
            | gsub("(?<p>^|\\n)(?<a>[ \\t]*\\[[^\\]\\n]+\\]):"; "\(.p)\(.a)\u200b:")
            | gsub("(?<f>```|~~~)[ \\t]*(?i:mermaid|geojson|topojson|stl)"; "\(.f)text")
            | .[0:$max];
          def body($max):
            . as $raw | clean($max) as $c
            | if $c != $raw and ($raw | test("(```|~~~)[ \\t]*suggestion")) then
                ($c | gsub("(?<f>```|~~~)[ \\t]*suggestion"; "\(.f)text"))
                + "\n\n(Shown as plain code, not as a suggestion: it held characters the workflow changes, so committing it would have changed them too.)"
              else $c end;'
          # Only Claude's summary: the others are this step's own, links included.
          if [ "$subtype" = success ] && [ "$leaked" = false ]; then
            summary=$(jq -rn --arg s "$summary" "$clean"' $s | clean(2000)')
          fi
          jq --argjson max "$MAX_BODY_CHARS" "$clean"' map(.body |= body($max) | .path |= (gsub("`"; "") | clean(300)))' \
            "$findings" >"$findings.tmp" && mv "$findings.tmp" "$findings"

          # All the inline findings as one review, so the author gets one notification.
          inline=$(jq -c '[.[] | select(.inline) | {path, line, side: "RIGHT", body}]' "$findings")
          n=$(jq length <<<"$inline")
          if [ "$n" -gt 0 ]; then
            body="**Claude review**: $n $([ "$n" = 1 ] && echo finding || echo findings) on the lines below."
            if ! jq -n --arg sha "$HEAD_SHA" --arg body "$body" --argjson c "$inline" \
              '{commit_id: $sha, event: "COMMENT", body: $body, comments: $c}' |
              gh api "repos/$GH_REPO/pulls/$PR/reviews" --input - --silent; then
              echo "::warning::Couldn't post the findings as a review, so they go in the summary comment."
              jq 'map(.inline = false)' "$findings" >"$findings.tmp" && mv "$findings.tmp" "$findings"
            fi
          fi

          # Name the model only when one ran.
          name=
          if [ "$NOTHING" != true ]; then
            name=$([ "$MODEL" = claude-opus-5-5 ] && echo ' (Opus)' || echo ' (Sonnet)')
          fi

          {
            echo '<!-- claude-review -->'
            echo "<!-- claude-review: sha=${sha:-none} runs=$runs cost=$total -->"
            echo "**Claude review**$name of $scope, up to \`${HEAD_SHA:0:7}\`: $summary"
            echo
            if [ "$(jq '[.[] | select(.inline | not)] | length' "$findings")" -gt 0 ]; then
              echo 'Findings not on a line of the diff:'
              echo
              jq -r '.[] | select(.inline | not) | "- `\(.path)` line \(.line): \(.body | gsub("\\s*\n\\s*"; " "))"' "$findings"
              echo
            fi
            if [ -s .claude-review/skipped.txt ]; then
              n=$(wc -l <.claude-review/skipped.txt | tr -d ' ')
              echo "<details><summary>Not reviewed: $n $([ "$n" = 1 ] && echo file || echo files) nobody reads line by line</summary>"
              echo
              awk -F'\t' '{ printf "- `%s`: %s\n", $1, $2 }' .claude-review/skipped.txt
              echo
              echo '</details>'
              echo
            fi
            echo "<sub>This review: \$$cost · this PR so far: \$$total over $runs $reviews$COST_NOTE.</sub>"
          } >"$RUNNER_TEMP/comment.md"

          # A new comment when there is none, or when someone deleted it since it was read.
          if [ -z "$COMMENT_ID" ] ||
            ! gh api -X PATCH "repos/$GH_REPO/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/comment.md" --silent; then
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent
          fi
          echo "Review cost: \$$cost (PR total \$$total over $runs $reviews)$COST_NOTE" >>"$GITHUB_STEP_SUMMARY"
          [ "$leaked" = false ]
