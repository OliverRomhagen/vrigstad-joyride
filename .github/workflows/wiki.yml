name: wiki

on:
  pull_request:
    # The wiki renders docs/ and its infoboxes and tables read the game's code and data, so a change to any of them can break
    # its build: a broken link in docs/ fails the prerender. Catch it here: on main, pages.yml deploys the game without a
    # wiki that fails, and the live wiki stays behind. main runs it on every push.
    paths:
      - 'docs/**'
      - 'wiki/**'
      - 'src/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wiki.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wiki:
    name: Wiki build (SvelteKit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wiki/package-lock.json
      # the root's packages too: the infoboxes import the game's modules, which import three from there
      - run: npm ci
      - run: npm ci --prefix wiki
      # types and Svelte's own checks, which the build doesn't do
      - run: npm run check --prefix wiki
      # the live site's base path, so the links are checked as they will be served
      - run: npm run build --prefix wiki
        env:
          BASE_PATH: /${{ github.event.repository.name }}/wiki
