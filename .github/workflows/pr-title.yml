name: PR title

# Squash merges use the PR title as the commit subject, and release notes are built from it,
# so it must follow Conventional Commits with the types in AGENTS.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with "Commits and PR titles" in AGENTS.md.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            style
            chore
            data
            revert
          requireScope: false
          # The action builds the RegExp without the u flag, so no \p{Lu}: list the Swedish capitals.
          subjectPattern: ^(?![A-ZÅÄÖ]).+[^.]$
          subjectPatternError: |
            The summary "{subject}" in "{title}" should start in lower case and not end with a period.

  length:
    name: Title length
    runs-on: ubuntu-latest
    steps:
      # The squash merge appends " (#123)", and GitHub cuts a commit subject off after 72 characters.
      - name: Title fits in 72 characters with the PR number
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export LC_ALL=C.UTF-8 # count characters, not bytes (å, ä, ö)
          suffix=" (#$NUMBER)"
          max=$((72 - ${#suffix}))
          # The title stays out of the ::error line: the runner would decode %25, %0A and %0D in it.
          echo "Title: $TITLE"
          if [ "${#TITLE}" -gt "$max" ]; then
            echo "::error title=PR title too long::The title is ${#TITLE} characters; with \"$suffix\" it must be at most $max."
            exit 1
          fi
          echo "${#TITLE} of $max characters."
