name: check

on:
  pull_request:
    # Skip PRs that only change docs, labels, issue forms, agent files or other workflows, as e2e.yml does; keep the
    # two filters the same. Later patterns win, so this workflow's own file still runs it. main runs it on every push.
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.github/**'
      - '.github/workflows/check.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # npm run check, the command AGENTS.md asks for before every commit. The Vite build doesn't typecheck.
    name: Check (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
