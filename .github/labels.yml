# Every label in the repo. Change labels here, by PR; .github/workflows/labels.yml syncs this file to GitHub on merge,
# but never deletes one (delete it here and with `gh label delete`). Issue types (Bug, Feature, Task) are not labels.

- name: "prio:high"
  color: "b60205"
  description: "Do soon: blocks the core game or other work"
- name: "prio:low"
  color: "c5def5"
  description: "Nice to have, or later"
- name: "prio:mid"
  color: "fbca04"
  description: "Planned, not urgent"
- name: "status:future"
  color: "bfdadc"
  description: "Alternative or later option, decide when its trigger happens"
- name: "scope:architecture"
  color: "1d76db"
  description: "Code structure, tooling, build, tests and workflow"
- name: "scope:audio"
  color: "51c211"
  description: "Sound effects, music and radio"
- name: "scope:hud"
  color: "51c211"
  description: "HUD, menus, map UI, mobile and accessibility"
- name: "scope:minigames"
  color: "be0237"
  description: "Minigames: trisslott, fishing, arcade and the like"
- name: "scope:multiplayer"
  color: "51c211"
  description: "Playing together: networking, chat and voice"
- name: "scope:npc"
  color: "51c211"
  description: "Pedestrians, characters, animals, dialogue and NPC behaviour"
- name: "scope:player"
  color: "51c211"
  description: "The player character: movement, camera, health and progression (money, saves, missions)"
- name: "scope:police"
  color: "51c211"
  description: "Wanted level, police cars and AI, getting caught"
- name: "scope:vehicles"
  color: "51c211"
  description: "Cars and other vehicles: driving, stealing, crashes, traffic"
- name: "scope:world"
  color: "51c211"
  description: "Terrain, buildings, landmarks and places, the data pipeline and the 3D map"
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
