# Every label in the repo. Change labels here, by PR; .github/workflows/labels.yml syncs this file to GitHub on merge,
# but never deletes one (delete it here and with `gh label delete`). Issue types (Bug, Feature, Task) are not labels.

- name: "prio:high"
  color: "b60205"
  description: "Do soon: blocks the core game or other work"
- name: "prio:low"
  color: "c5def5"
  description: "Nice to have, or later"
- name: "prio:mid"
  color: "fbca04"
  description: "Planned, not urgent"
- name: "status:future"
  color: "bfdadc"
  description: "Alternative or later option, decide when its trigger happens"
- name: "status:blocked"
  from_name: "blocked"
  color: "8d270f"
  description: "Waiting for something, or someone"
- name: "lab"
  color: "5319e7"
  description: "Lab experiment: opt-in, then kept as a feature or dropped"
- name: "preview"
  color: "0e8a16"
  description: "Deploy a playable preview of this PR (feat PRs get one without it)"
- name: "playtest"
  color: "1d76db"
  description: "Merge this PR into the shared playtest preview, with the other labelled PRs"
# Type labels: PR triage sets them from the PR title, for the release notes' sections (.github/release.yml). Not by hand.
- name: "breaking"
  color: "d93f0b"
  description: "Breaking change: the PR title has a ! (feat!: …)"
- name: "type:feat"
  color: "c2e0c6"
  description: "New gameplay or feature, from the PR title"
- name: "type:fix"
  color: "c2e0c6"
  description: "Bug fix, from the PR title"
- name: "type:perf"
  color: "c2e0c6"
  description: "Performance, from the PR title"
- name: "type:data"
  color: "c2e0c6"
  description: "Map data or pipeline, from the PR title"
- name: "type:revert"
  color: "c2e0c6"
  description: "Reverts an earlier change, from the PR title"
- name: "type:refactor"
  color: "ededed"
  description: "Code structure, no behaviour change, from the PR title"
- name: "type:test"
  color: "ededed"
  description: "Tests, from the PR title"
- name: "type:ci"
  color: "ededed"
  description: "CI workflows, from the PR title"
- name: "type:build"
  color: "ededed"
  description: "Build and tooling: Vite, npm, linters, from the PR title"
- name: "type:chore"
  color: "ededed"
  description: "Upkeep: labels, config and the like, from the PR title"
- name: "type:style"
  color: "ededed"
  description: "Formatting only, from the PR title"
- name: "type:docs"
  color: "ededed"
  description: "Documentation, from the PR title"
- name: "scope:architecture"
  color: "1d76db"
  description: "Code structure, tooling, build, tests and workflow"
- name: "scope:audio"
  color: "51c211"
  description: "Sound effects, music and radio"
- name: "scope:hud"
  color: "51c211"
  description: "HUD, menus, map UI, mobile and accessibility"
- name: "scope:minigames"
  color: "be0237"
  description: "Minigames: trisslott, fishing, arcade and the like"
- name: "scope:multiplayer"
  color: "51c211"
  description: "Playing together: networking, chat and voice"
- name: "scope:npc"
  color: "51c211"
  description: "Pedestrians, characters, animals, dialogue and NPC behaviour"
- name: "scope:player"
  color: "51c211"
  description: "The player character: movement, camera, health and progression (money, saves, missions)"
- name: "scope:police"
  color: "51c211"
  description: "Wanted level, police cars and AI, getting caught"
- name: "scope:vehicles"
  color: "51c211"
  description: "Cars and other vehicles: driving, stealing, crashes, traffic"
- name: "scope:wiki"
  color: "51c211"
  description: "The players' wiki in wiki/ and its lore pages in docs/lore/"
- name: "scope:world"
  color: "51c211"
  description: "Terrain, buildings, landmarks and places, the data pipeline and the 3D map"
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "security"
  color: "d93f0b"
  description: "Hardening: workflow permissions, secrets, untrusted input"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
