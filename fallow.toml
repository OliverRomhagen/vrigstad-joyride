# Fallow (#107): the static gate at the end of `npm run check`. AGENTS.md (Tests) says what each pass checks.
# Fallow finds the Vite, Vitest and Playwright entry points itself; this file adds only what it can't see, the
# architecture rules, and today's exceptions. Shrink the exceptions; don't grow them.
# package.json pins Fallow exactly: it is young, and `fallow dead-code` checking cycles and boundaries is due to
# move to `fallow architecture` in a later major version, so an upgrade must add that command to `check`.

# Loaded in ways Fallow can't follow:
# - src/map/main.ts is map.html's script, and tools/build.mjs builds map.html, but Fallow's Vite plugin finds only index.html.
# - tools/trailer/rig.js reads inpage.js with fs.readFileSync and runs it in the page.
entry = ["src/map/main.ts", "tools/trailer/inpage.js"]

# Exceptions: exported, but only used in their own file. Un-export them, or use them in a test, then drop the entry.
# tools/streetscape-report.mjs loads these through Vite's runnerImport, which Fallow can't follow.
[[ignoreExports]]
file = "tools/streetscape-report.ts"
exports = ["report"]

[[ignoreExports]]
file = "tools/furniture-report.ts"
exports = ["report"]

[[ignoreExports]]
file = "src/game/health.ts"
exports = ["CRASH_MIN_MS", "CRASH_DMG_PER_MS", "HURT_MIN_MS", "HURT_HP_PER_MS", "RUN_OVER_MIN_MS", "RUN_OVER_HP_PER_MS", "SMOKE_AT", "BLACK_SMOKE_AT", "LIMP_AT", "CRACK_AT"]

[[ignoreExports]]
file = "src/game/cats.ts"
exports = ["CAT_NAME", "CAT_NAME_MAX"]

# Layers, from ARCHITECTURE.md. A file belongs to the first zone that matches it. biome.jsonc and tsconfig.sim.json
# check three.js and the DOM, which Fallow can't see, on the world, world-mesh and sim zones: keep the paths of
# biome.jsonc's rule-2 override and of tsconfig.sim.json the same as these (tests/unit/zones.test.ts checks).
[boundaries]
# src/world/: the world's data and queries, shared by both pages. Its three.js code lives only in mesh/ and three-legacy.ts.
[[boundaries.zones]]
name = "world-mesh"
patterns = ["src/world/mesh/**", "src/world/three-legacy.ts"]

[[boundaries.zones]]
name = "world"
patterns = ["src/world/**"]

# The page modules in src/game/, which would otherwise fall into sim below. They are page code (see the last zone).
[[boundaries.zones]]
name = "page"
patterns = ["src/game/main.ts", "src/game/hud.ts", "src/game/input.ts", "src/game/menu.ts", "src/game/loop.ts", "src/game/prompt.ts", "src/game/test-hook.ts", "src/game/devconsole.ts", "src/game/confetti.ts"]

[[boundaries.zones]]
name = "render"
# presentation/: overlays drawn over the whole page (the ISO 800 grain), which own their DOM layer.
patterns = ["src/game/render/**", "src/game/presentation/**"]

# Game rules as plain data: everything else in src/game/, src/game/sim/ once #49 moves the rules there, so a new module is checked
# from its first commit. A new page module goes in the page list above instead.
[[boundaries.zones]]
name = "sim"
patterns = ["src/game/**"]

# Everything else in src/: the map page and the lab, with the page modules listed above. It may import anything (it has
# no rule), but the other zones may not import it.
[[boundaries.zones]]
name = "page"
patterns = ["src/**"]

[[boundaries.rules]]
from = "world"
allow = ["world"]

[[boundaries.rules]]
from = "world-mesh"
allow = ["world", "world-mesh"]

[[boundaries.rules]]
from = "sim"
allow = ["sim", "world"]

[[boundaries.rules]]
from = "render"
allow = ["render", "sim", "world", "world-mesh"]
