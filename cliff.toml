# git-cliff (https://git-cliff.org) config for the GitHub release notes.
# Every commit on main is a squash merge whose subject is the PR title plus " (#n)",
# so the Conventional Commits type sets the group and the scope goes in bold.
# The <!-- n --> prefixes only fix the order of the groups; striptags removes them.

[changelog]
body = """
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}
{%- set name = group | striptags | trim %}
{%- if name is starting_with("🔧") %}
<details><summary>{{ name }} ({{ commits | length }})</summary>

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{% endfor %}
</details>
{% else %}
### {{ name }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{% endfor %}
{%- endif %}
{%- endfor %}
{%- if previous.version %}

**Full changelog:** https://github.com/OliverRomhagen/vrigstad-joyride/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  # "(#123)" at the end becomes "#123", which GitHub links in a release
  { pattern = '(?m)[ \t]*\(#(\d+)\)$', replace = " #${1}" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^data", group = "<!-- 3 -->🗺️ Data" },
  { message = ".*", group = "<!-- 4 -->🔧 Under the hood" },
]
